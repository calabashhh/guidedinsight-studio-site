<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Hong Kong Live Traffic</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<style>

html, body {
    height: 100%;
    margin: 0;
}

#map {
    height: 100%;
    width: 100%;
}

.info,
.legend {
    background: white;
    padding: 9px 11px;
    font-family: Arial, sans-serif;
    font-size: 13px;
    line-height: 1.45;
    box-shadow: 0 1px 5px rgba(0,0,0,0.35);
    border-radius: 4px;
}

.legend-line {
    display: inline-block;
    width: 24px;
    height: 4px;
    margin-right: 7px;
    vertical-align: middle;
}

.small {
    font-size: 11px;
    color: #666;
}

</style>
</head>

<body>

<div id="map"></div>

<script>

const REFRESH_INTERVAL_MS = 120000;
const STALE_AFTER_MINUTES = 20;

const map = L.map("map").setView(
    [22.32, 114.17],
    11
);

L.tileLayer(
    "https://basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}.png?key=cb1_316i_1_7420184ded0f7b53c5cc16cd",
    {
        attribution:
            '&copy; OpenStreetMap contributors &copy; CARTO'
    }
).addTo(map);


let trafficState = new Map();
let trafficLayer = null;
let latestTrafficTime = null;
let latestRainTime = null;
let displayMode = "speed";

// ----------------------------------------------------------
// CSV reader
// ----------------------------------------------------------

async function loadTrafficState() {

    const response = await fetch(
        "https://raw.githubusercontent.com/calabashhh/guidedinsight-studio-site/main/traffic_live_state.csv?ts=" + Date.now(),
        { cache: "no-store" }
    );

    if (!response.ok) {
        throw new Error(
            "Could not load traffic_live_state.csv"
        );
    }

    const text = await response.text();
    const lines = text.trim().split(/\r?\n/);

    const headers = lines[0].split(",");
    const records = new Map();

    latestTrafficTime = null;
    latestRainTime = null;

    for (let i = 1; i < lines.length; i++) {

        const values = lines[i].split(",");

        const row = {};

        headers.forEach((header, index) => {
            row[header] = values[index] ?? "";
        });

        records.set(
            String(row.ROUTE_ID),
            row
        );

        if (!latestTrafficTime &&
            row.traffic_date &&
            row.traffic_time) {

            latestTrafficTime =
                row.traffic_date +
                "T" +
                row.traffic_time +
                "+08:00";
        }

        if (!latestRainTime &&
            row.rain_obs_time) {

            latestRainTime =
                row.rain_obs_time;
        }
    }

    return records;
}


// ----------------------------------------------------------
// Freshness
// ----------------------------------------------------------

function trafficAgeMinutes(row) {

    if (!row ||
        !row.traffic_date ||
        !row.traffic_time) {

        return Infinity;
    }

    const observation =
        new Date(
            row.traffic_date +
            "T" +
            row.traffic_time +
            "+08:00"
        );

    return (
        Date.now() - observation.getTime()
    ) / 60000;
}


function isTrafficCurrent(row) {

    return (
        row &&
        row.valid === "Y" &&
        trafficAgeMinutes(row) <=
            STALE_AFTER_MINUTES
    );
}


// ----------------------------------------------------------
// Road styling
// ----------------------------------------------------------

function speedColor(speed) {

    if (speed < 20) return "#b2182b";
    if (speed < 35) return "#ef8a62";
    if (speed < 50) return "#fddbc7";
    if (speed < 70) return "#67a9cf";

    return "#2166ac";
}


function rainColor(rain) {

    if (rain <= 0) return "#d7eaf7";
    if (rain < 2) return "#9ecae1";
    if (rain < 5) return "#6baed6";
    if (rain < 15) return "#3182bd";
    if (rain < 30) return "#08519c";

    return "#08306b";
}


function relativeSpeedColor(diffPct) {

    if (diffPct <= -30) return "#b2182b";
    if (diffPct < -15) return "#ef8a62";
    if (diffPct <= 15) return "#f7f7f7";
    if (diffPct < 30) return "#67a9cf";

    return "#2166ac";
}


function trafficStyle(feature) {

    const routeId =
        String(feature.properties.ROUTE_ID);

    const row =
        trafficState.get(routeId);


    if (displayMode === "rain") {

        if (
            !row ||
            row.rain_est_mm_1h === "" ||
            !Number.isFinite(Number(row.rain_est_mm_1h))
        ) {

            return {
                color: "#666",
                weight: 3,
                opacity: 0.7
            };
        }

        const rain =
            Number(row.rain_est_mm_1h);

        return {
            color: rainColor(rain),
            weight: 3,
            opacity: 0.95,
            dashArray: null
        };
    }


    if (displayMode === "relative") {

        if (!isTrafficCurrent(row)) {

            return {
                color: "#777",
                weight: 3,
                opacity: 0.8
            };
        }

        if (
            row.speed_diff_pct === "" ||
            !Number.isFinite(Number(row.speed_diff_pct))
        ) {

            return {
                color: "#555",
                weight: 3,
                opacity: 0.8
            };
        }

        const diffPct =
            Number(row.speed_diff_pct);

        return {
            color: relativeSpeedColor(diffPct),
            weight: 3,
            opacity: 0.95,
            dashArray: null
        };
    }


    if (!isTrafficCurrent(row)) {

        return {
            color: "#888",
            weight: 3,
            opacity: 0.8
        };
    }

    const speed =
        Number(row.speed_kmh);

    return {
        color: speedColor(speed),
        weight: 3,
        opacity: 0.95,
        dashArray: null
    };
}

// ----------------------------------------------------------
// Popup content
// ----------------------------------------------------------

function baselineTypeLabel(type) {

    if (type === "dow") {
        return "Same weekday";
    }

    if (type === "day_type") {
        return "Weekday/weekend";
    }

    if (type === "all") {
        return "All days";
    }

    return "Unavailable";
}


function popupContent(feature) {

    const routeId =
        String(feature.properties.ROUTE_ID);

    const row =
        trafficState.get(routeId);

    const roadName =
        feature.properties.STREET_ENAME || "Unnamed road";


    let html =
        `<div style="min-width:220px;">` +

        `<div style="font-size:15px; font-weight:bold; margin-bottom:2px;">` +
        `${roadName}` +
        `</div>` +

        `<div style="font-size:11px; color:#666; margin-bottom:8px;">` +
        `Route ID ${routeId}` +
        `</div>`;


    if (!row) {

        html +=
            `<b>Traffic</b>` +
            `<br>Status: No current record` +
            `</div>`;

        return html;
    }


    const age =
        trafficAgeMinutes(row);


    // ------------------------------------------------------
    // Traffic
    // ------------------------------------------------------

    html +=
        `<div style="border-top:1px solid #ccc; padding-top:6px;">` +
        `<b>Traffic</b>`;


    if (isTrafficCurrent(row)) {

        html +=
            `<br><b>Current speed:</b> ` +
            `${row.speed_kmh} km/h`;

        html +=
            `<br><b>Status:</b> Current`;

    } else {

        html +=
            `<br><b>Status:</b> ` +
            (
                row.valid !== "Y"
                ? "Reading unavailable"
                : "Reading stale"
            );

        if (row.speed_kmh !== "") {

            html +=
                `<br><b>Last speed:</b> ` +
                `${row.speed_kmh} km/h`;
        }
    }


    html +=
        `<br><b>Observation:</b> ` +
        `${row.traffic_date} ${row.traffic_time}`;


    if (Number.isFinite(age)) {

        html +=
            `<br><b>Observation age:</b> ` +
            `${age.toFixed(1)} min`;
    }


    html += `</div>`;


    // ------------------------------------------------------
    // Time-matched baseline
    // ------------------------------------------------------

    html +=
        `<div style="border-top:1px solid #ccc; margin-top:7px; padding-top:6px;">` +
        `<b>Time-matched baseline</b>`;


    if (
        row.baseline_median_kmh !== "" &&
        Number.isFinite(Number(row.baseline_median_kmh))
    ) {

        html +=
            `<br><b>Median speed:</b> ` +
            `${Number(row.baseline_median_kmh).toFixed(1)} km/h`;

        if (
            row.speed_diff_kmh !== "" &&
            Number.isFinite(Number(row.speed_diff_kmh))
        ) {

            const diffKmh =
                Number(row.speed_diff_kmh);

            const diffPct =
                Number(row.speed_diff_pct);

            const diffKmhText =
                `${diffKmh >= 0 ? "+" : ""}${diffKmh.toFixed(1)} km/h`;

            const diffPctText =
                Number.isFinite(diffPct)
                ? `${diffPct >= 0 ? "+" : ""}${diffPct.toFixed(1)}%`
                : "";

            html +=
                `<br><b>Difference:</b> ` +
                `${diffKmhText}` +
                (
                    diffPctText
                    ? ` (${diffPctText})`
                    : ""
                );
        }

        if (
            row.baseline_p25_kmh !== "" &&
            row.baseline_p75_kmh !== ""
        ) {

            html +=
                `<br><b>Middle 50%:</b> ` +
                `${Number(row.baseline_p25_kmh).toFixed(1)}–` +
                `${Number(row.baseline_p75_kmh).toFixed(1)} km/h`;
        }

        html +=
            `<br><b>Match:</b> ` +
            `${baselineTypeLabel(row.baseline_type)}`;

        if (row.baseline_days) {

            html +=
                `<br><b>Historical days:</b> ` +
                `${row.baseline_days}`;
        }

        if (row.baseline_label) {

            html +=
                `<br><b>Sample depth:</b> ` +
                `${row.baseline_label}`;
        }

    } else {

        html +=
            `<br>Baseline unavailable`;
    }


    html += `</div>`;


    // ------------------------------------------------------
    // Rainfall
    // ------------------------------------------------------

    html +=
        `<div style="border-top:1px solid #ccc; margin-top:7px; padding-top:6px;">` +
        `<b>Rainfall</b>`;


    if (
        row.rain_est_mm_1h !== "" &&
        Number.isFinite(Number(row.rain_est_mm_1h))
    ) {

        html +=
            `<br><b>Estimated past hour:</b> ` +
            `${Number(row.rain_est_mm_1h).toFixed(1)} mm`;

    } else {

        html +=
            `<br><b>Estimated past hour:</b> Unavailable`;
    }


    if (row.rain_obs_time) {

        html +=
            `<br><b>Observation:</b> ` +
            `${row.rain_obs_time}`;
    }


    if (row.rain_stations_used) {

        html +=
            `<br><b>Stations used:</b> ` +
            `${row.rain_stations_used}`;
    }


    html +=
        `</div>` +
        `</div>`;


    return html;
}


// ----------------------------------------------------------
// Status control
// ----------------------------------------------------------

const info = L.control({
    position: "topright"
});

info.onAdd = function() {

    this._div =
        L.DomUtil.create(
            "div",
            "info"
        );

    this.update();

    return this._div;
};


info.update = function() {

    if (!this._div) return;

    let trafficText = "Unavailable";
    let rainText = "Unavailable";

    if (latestTrafficTime) {

        const d =
            new Date(latestTrafficTime);

        const age =
            (Date.now() -
             d.getTime()) / 60000;

        trafficText =
            `${latestTrafficTime}` +
            `<br>` +
            `<span class="small">` +
            `${age.toFixed(1)} min old` +
            `</span>`;
    }


    if (latestRainTime) {

        rainText =
            latestRainTime;
    }


    this._div.innerHTML =
        `<b>HK Live Traffic</b>` +
        `<br><br>` +
        `<b>Traffic:</b><br>` +
        trafficText +
        `<br><br>` +
        `<b>Rainfall:</b><br>` +
        rainText +
        `<br><br>` +
        `<span class="small">` +
        `Map refreshes every 2 minutes` +
        `</span>`;
};

info.addTo(map);

// ----------------------------------------------------------
// Display mode control
// ----------------------------------------------------------

const modeControl = L.control({
    position: "topleft"
});

modeControl.onAdd = function() {

    const div =
        L.DomUtil.create(
            "div",
            "info"
        );

    div.innerHTML =
        `<b>Display</b><br>` +
        `<select id="display-mode" ` +
        `style="margin-top:5px; width:165px;">` +
        `<option value="speed">Current speed</option>` +
        `<option value="relative">Speed vs normal</option>` +
        `<option value="rain">Recent rainfall</option>` +
        `</select>`;

    L.DomEvent.disableClickPropagation(div);
    L.DomEvent.disableScrollPropagation(div);

    const select =
        div.querySelector("#display-mode");

    select.value =
        displayMode;

    select.addEventListener(
        "change",
        function() {

            displayMode =
                this.value;

            if (trafficLayer) {

                trafficLayer.setStyle(
                    trafficStyle
                );
            }

            updateLegend();
        }
    );

    return div;
};

modeControl.addTo(map);

// ----------------------------------------------------------
// Legend
// ----------------------------------------------------------

let legendDiv = null;

const legend = L.control({
    position: "bottomright"
});

legend.onAdd = function() {

    legendDiv =
        L.DomUtil.create(
            "div",
            "legend"
        );

    updateLegend();

    return legendDiv;
};


function updateLegend() {

    if (!legendDiv) return;


    if (displayMode === "rain") {

        legendDiv.innerHTML =
            `<b>Estimated rainfall, past hour</b><br>` +

            `<span class="legend-line" ` +
            `style="background:#d7eaf7"></span>` +
            `0 mm<br>` +

            `<span class="legend-line" ` +
            `style="background:#9ecae1"></span>` +
            `>0–2 mm<br>` +

            `<span class="legend-line" ` +
            `style="background:#6baed6"></span>` +
            `2–5 mm<br>` +

            `<span class="legend-line" ` +
            `style="background:#3182bd"></span>` +
            `5–15 mm<br>` +

            `<span class="legend-line" ` +
            `style="background:#08519c"></span>` +
            `15–30 mm<br>` +

            `<span class="legend-line" ` +
            `style="background:#08306b"></span>` +
            `30+ mm<br><br>` +

            `<span class="legend-line" ` +
            `style="background:#666"></span>` +
            `Rainfall unavailable`;

        return;
    }


    if (displayMode === "relative") {

        legendDiv.innerHTML =
            `<b>Current speed vs time-matched baseline</b><br>` +

            `<span class="legend-line" ` +
            `style="background:#b2182b"></span>` +
            `30%+ slower<br>` +

            `<span class="legend-line" ` +
            `style="background:#ef8a62"></span>` +
            `15–30% slower<br>` +

            `<span class="legend-line" ` +
            `style="background:#f7f7f7"></span>` +
            `Within ±15%<br>` +

            `<span class="legend-line" ` +
            `style="background:#67a9cf"></span>` +
            `15–30% faster<br>` +

            `<span class="legend-line" ` +
            `style="background:#2166ac"></span>` +
            `30%+ faster<br><br>` +

            `<span class="legend-line" ` +
            `style="background:#777"></span>` +
            `No current valid reading<br>` +

            `<span class="legend-line" ` +
            `style="background:#555"></span>` +
            `Baseline unavailable`;

        return;
    }


    legendDiv.innerHTML =
        `<b>Current speed</b><br>` +

        `<span class="legend-line" ` +
        `style="background:#b2182b"></span>` +
        `under 20 km/h<br>` +

        `<span class="legend-line" ` +
        `style="background:#ef8a62"></span>` +
        `20–35 km/h<br>` +

        `<span class="legend-line" ` +
        `style="background:#fddbc7"></span>` +
        `35–50 km/h<br>` +

        `<span class="legend-line" ` +
        `style="background:#67a9cf"></span>` +
        `50–70 km/h<br>` +

        `<span class="legend-line" ` +
        `style="background:#2166ac"></span>` +
        `70+ km/h<br><br>` +

        `<span class="legend-line" ` +
        `style="background:#777"></span>` +
        `No current valid reading<br>` +

        `<span class="legend-line" ` +
        `style="background:#bbb"></span>` +
        `No live-speed coverage`;
}


legend.addTo(map);

// ----------------------------------------------------------
// Initial map build
// ----------------------------------------------------------

async function buildMap() {

    trafficState =
        await loadTrafficState();


    const backgroundResponse =
        await fetch(
            "roads_background_simplified_2m.geojson"
        );

    const backgroundData =
        await backgroundResponse.json();


    L.geoJSON(
        backgroundData,
        {
            style: {
                color: "#bbbbbb",
                weight: 0.7,
                opacity: 0.45
            },

            interactive: false
        }
    ).addTo(map);


    const trafficResponse =
        await fetch(
            "traffic_overlay.geojson"
        );

    const trafficData =
        await trafficResponse.json();


    trafficLayer =
        L.geoJSON(
            trafficData,
            {

                style: trafficStyle,

                onEachFeature:
                    function(feature, layer) {

                        layer.bindPopup(
                            popupContent(feature)
                        );
                    }
            }
        ).addTo(map);


    info.update();
}


// ----------------------------------------------------------
// Refresh only changing data
// ----------------------------------------------------------

async function refreshLiveData() {

    try {

        const newState =
            await loadTrafficState();

        trafficState =
            newState;


        if (trafficLayer) {

            trafficLayer.eachLayer(
                function(layer) {

                    layer.setStyle(
                        trafficStyle(
                            layer.feature
                        )
                    );

                    layer.setPopupContent(
                        popupContent(
                            layer.feature
                        )
                    );
                }
            );
        }


        info.update();

        console.log(
            "Live traffic refreshed:",
            new Date().toISOString()
        );

    } catch (error) {

        console.error(
            "Live refresh failed:",
            error
        );
    }
}


// ----------------------------------------------------------
// Start
// ----------------------------------------------------------

buildMap().then(() => {

    setInterval(
        refreshLiveData,
        REFRESH_INTERVAL_MS
    );

});

</script>

</body>
</html>
